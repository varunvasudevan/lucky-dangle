<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lucky Dangle — a charm for your browser · by Varun Kumar</title>
<meta name="description" content="Choose a lucky charm and hang it from the top of your screen. It sways while you work, and drops a little luck when you call it. Developed by Varun Kumar." />
<meta name="author" content="Varun Kumar" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#150f27;
    --sky-mid:#2a1a45;
    --sky-bottom:#3d2159;
    --wood:#4a3527;
    --wood-dark:#2f2117;
    --brass:#c9a24b;
    --brass-light:#e6c877;
    --ivory:#f3e9d8;
    --muted:#a597b8;
    --panel:rgba(20,14,34,0.72);
    --glow:#c9a24b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-bottom) 100%);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ivory);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }

  /* ambient stars */
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;}
  .stars span{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:var(--ivory);opacity:.5;
    animation:twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.7;}}

  /* brand mark */
  .brand{
    position:fixed;top:14px;left:18px;z-index:20;
    font-family:'Fraunces',serif;font-size:15px;letter-spacing:.02em;
    color:var(--ivory);opacity:.85;
    display:flex;align-items:baseline;gap:6px;
  }
  .brand small{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);
  }

  /* the beam / lintel the charm hangs from */
  .beam-wrap{
    position:fixed;top:0;left:0;right:0;z-index:10;
    transition:transform .6s cubic-bezier(.6,-0.1,.2,1);
  }
  .beam-wrap.hidden{transform:translateY(-140%);}
  .beam{
    height:30px;width:100%;
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 26px),
      linear-gradient(180deg,var(--wood) 0%,var(--wood-dark) 100%);
    box-shadow:0 8px 22px rgba(0,0,0,.45);
    border-bottom:1px solid rgba(0,0,0,.4);
  }
  .hook{
    position:absolute;top:24px;width:16px;height:16px;margin-left:-8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--brass-light),var(--brass) 60%,#7a5f27 100%);
    box-shadow:0 3px 6px rgba(0,0,0,.5);
    cursor:grab;z-index:11;
  }
  .hook:active{cursor:grabbing;}
  .hook::after{
    content:'';position:absolute;inset:-10px;border-radius:50%;
  }

  svg#threadSvg{position:fixed;inset:0;z-index:9;pointer-events:none;width:100%;height:100%;overflow:visible;}

  /* glass beads: radial shading + specular highlight, like the reference */
  .bead{
    position:fixed;top:0;left:0;z-index:11;pointer-events:none;
    border-radius:50%;
    --b:#c9a24b;
    background:radial-gradient(circle at 37% 30%,
      color-mix(in srgb,var(--b) 38%,#fff) 0%,
      var(--b) 55%,
      color-mix(in srgb,var(--b) 40%,#000) 100%);
    box-shadow:0 1px 3px rgba(0,0,0,.5);
    will-change:transform;
  }
  .bead::after{
    content:'';position:absolute;left:19%;top:16%;width:28%;height:20%;
    border-radius:50%;background:rgba(255,255,255,.85);transform:rotate(-30deg);
  }

  .charm{
    position:fixed;top:0;left:0;z-index:12;
    font-size:64px;line-height:1;
    transform-origin:0 0;
    cursor:grab;user-select:none;-webkit-user-select:none;
    filter:drop-shadow(0 0 20px var(--glow)) drop-shadow(0 8px 12px rgba(0,0,0,.4));
    will-change:transform;
    transition:filter .4s ease;
  }
  .charm:active{cursor:grabbing;}
  .charm.dragging{transition:none;}
  .charm:hover:not(.dragging){
    filter:drop-shadow(0 0 30px var(--glow)) drop-shadow(0 0 10px var(--glow)) drop-shadow(0 8px 12px rgba(0,0,0,.4));
  }
  .charm .glyph{display:block;position:relative;}
  /* the cord runs on into the charm, like the reference's cord tail */
  .charm .tail{
    position:absolute;left:50%;top:0;width:2.4px;height:40%;margin-left:-1.2px;
    background:linear-gradient(180deg,#9e7a45,#8c6b38);border-radius:1px;z-index:-1;
  }

  .twinkle-spark{
    position:fixed;z-index:14;pointer-events:none;
    font-size:11px;color:var(--glow);
    animation:twinkle-pop .6s ease-out forwards;
  }
  @keyframes twinkle-pop{
    0%{opacity:0;transform:scale(.2) rotate(0deg);}
    35%{opacity:1;transform:scale(1.15) rotate(45deg);}
    100%{opacity:0;transform:scale(.5) rotate(90deg) translateY(-8px);}
  }

  .eyes{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    display:none;gap:7px;pointer-events:none;
  }
  .eyes span{
    width:6px;height:6px;border-radius:50%;
    background:rgba(0,0,0,.15);border:1px solid rgba(0,0,0,.3);
  }
  .eyes span.painted{background:#1a1a1a;border-color:#000;}

  .sparkle{
    position:fixed;z-index:14;pointer-events:none;
    font-size:14px;opacity:1;
    animation:sparkle-out .9s ease-out forwards;
  }
  @keyframes sparkle-out{
    0%{opacity:1;transform:translate(0,0) scale(.6);}
    100%{opacity:0;transform:var(--end) scale(1.1);}
  }

  .hint{
    position:fixed;top:44px;left:50%;transform:translateX(-50%);
    z-index:8;font-size:13px;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;
    opacity:1;transition:opacity .8s ease;pointer-events:none;
    text-align:center;
  }
  .hint.gone{opacity:0;}

  /* hide/show tab */
  .hide-tab{
    position:fixed;top:8px;right:16px;z-index:21;
    background:var(--panel);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08);
    color:var(--muted);font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:7px 12px;border-radius:0 0 10px 10px;
    cursor:pointer;transition:color .2s,background .2s;
  }
  .hide-tab:hover{color:var(--ivory);background:rgba(30,20,48,.9);}

  /* bottom control panel */
  .panel{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--panel);backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.08);
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
    border-radius:20px 20px 0 0;
  }
  .picker{
    display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;margin-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.07);
    scrollbar-width:thin;
  }
  .charm-btn{
    flex:0 0 auto;width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:rgba(255,255,255,.04);
    border:2px solid transparent;
    cursor:pointer;transition:transform .15s ease,border-color .2s ease,background .2s ease;
  }
  .charm-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.08);}
  .charm-btn.active{border-color:var(--btn-color,var(--brass));background:rgba(255,255,255,.08);}

  .info{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;}
  .info-text{flex:1 1 260px;min-width:0;}
  .info-text h1{
    font-family:'Fraunces',serif;font-weight:560;font-size:22px;margin:0 0 2px;
  }
  .info-text .origin{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block;
  }
  .info-text p{margin:0;font-size:13.5px;line-height:1.5;color:#d9cfe8;max-width:52ch;}

  .actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;}
  .ritual-btn{
    font-family:'Fraunces',serif;font-size:14.5px;font-weight:500;
    padding:10px 20px;border-radius:999px;border:none;cursor:pointer;
    background:linear-gradient(180deg,var(--brass-light),var(--brass));
    color:#241705;box-shadow:0 4px 14px rgba(201,162,75,.35);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .ritual-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(201,162,75,.45);}
  .ritual-btn:active{transform:translateY(0);}
  .shortcuts{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.03em;}

  .ritual-note{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass-light);
    min-height:14px;margin-top:6px;opacity:0;transition:opacity .3s ease;
  }
  .ritual-note.show{opacity:1;}

  .custom-row{display:none;gap:8px;margin-top:10px;}
  .custom-row.show{display:flex;}
  .custom-row input{
    flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;color:var(--ivory);font-size:20px;text-align:center;padding:6px;
    width:64px;font-family:'Inter',sans-serif;
  }
  .custom-row button{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    color:var(--ivory);border-radius:10px;padding:0 14px;cursor:pointer;font-size:13px;
    font-family:'Inter',sans-serif;
  }
  .custom-row button:hover{background:rgba(255,255,255,.14);}

  @media (max-width:560px){
    .charm{font-size:48px;}
    .info{align-items:flex-start;}
    .actions{flex-direction:row-reverse;align-items:center;width:100%;justify-content:space-between;}
    .info-text p{max-width:100%;}
  }

  @media (prefers-reduced-motion:reduce){
    .stars span{animation:none;opacity:.35;}
    .beam-wrap{transition:none;}
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="brand">Lucky Dangle <small>for the browser · by Varun Kumar</small></div>
  <button class="hide-tab" id="hideTab" title="Hide the dangle (H)">Hide ⌃H</button>

  <div class="hint" id="hint">grab the charm, pull it, let go</div>

  <div class="beam-wrap" id="beamWrap">
    <div class="beam"></div>
    <div class="hook" id="hook"></div>
  </div>

  <svg id="threadSvg"><path id="threadPath" d="" stroke="#b8945a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>

  <div class="bead" id="bead0"></div>
  <div class="bead" id="bead1"></div>
  <div class="bead" id="bead2"></div>

  <div class="charm" id="charm">
    <span class="tail"></span>
    <span class="glyph" id="charmGlyph">🧿</span>
    <div class="eyes" id="eyes"><span id="eyeL"></span><span id="eyeR"></span></div>
  </div>

  <div class="panel">
    <div class="picker" id="picker"></div>
    <div class="info">
      <div class="info-text">
        <h1 id="charmName"></h1>
        <span class="origin" id="charmOrigin"></span>
        <p id="charmDesc"></p>
        <div class="ritual-note" id="ritualNote"></div>
        <div class="custom-row" id="customRow">
          <input id="customInput" maxlength="4" placeholder="✨" />
          <button id="customApply">Hang it</button>
        </div>
      </div>
      <div class="actions">
        <button class="ritual-btn" id="ritualBtn">Perform ritual</button>
        <span class="shortcuts">R · bless&nbsp;&nbsp;H · hide</span>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- starfield ---------- */
  const starsEl = document.getElementById('stars');
  for(let i=0;i<46;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*70+'%';
    s.style.animationDelay = (Math.random()*5)+'s';
    s.style.animationDuration = (3+Math.random()*4)+'s';
    starsEl.appendChild(s);
  }

  /* ---------- charm data ---------- */
  const CHARMS = [
    {id:'nazar', emoji:'🧿', name:'Nazar boncuğu', origin:'Turkey & the Mediterranean',
      desc:'A glass eye worn against the evil eye. Give it a flick when you want a little cover.',
      color:'#3f7fe0', note:'Flicked. Cover’s on.', beads:['#eef3fa','#3f7fe0','#eef3fa']},
    {id:'hamsa', emoji:'🪬', name:'Hamsa', origin:'Middle East & North Africa',
      desc:'An open hand carried for protection and good fortune. Bless it to send bad luck on its way.',
      color:'#d9b44a', note:'Bad luck, sent off.', beads:['#1c2f6b','#d9b44a','#1c2f6b']},
    {id:'clover', emoji:'🍀', name:'Four-leaf clover', origin:'Europe & the Americas',
      desc:'Rare among its three-leafed kin, kept for the odds it beat just by growing. Bless it before you need the odds again.',
      color:'#57a86a', note:'Odds, beaten again.', beads:['#eef3fa','#57a86a','#eef3fa']},
    {id:'daruma', emoji:'🪆', name:'Daruma', origin:'Japan',
      desc:'A wishing doll for goals that take some grit. Paint one eye when you make a wish, the other when it comes true.',
      color:'#c9522f', note:'', stage:0, isDaruma:true, beads:['#eef3fa','#c9522f','#eef3fa']},
    {id:'cat', emoji:'🐱', name:'Maneki-neko', origin:'Japan',
      desc:'A beckoning cat that invites good fortune in. Bless it and watch fortune answer.',
      color:'#e3b23c', note:'Fortune, beckoned in.', beads:['#e3b23c','#d4211a','#e3b23c']},
    {id:'custom', emoji:'✨', name:'Yours', origin:'Wherever you’re from',
      desc:'Choose any emoji and make the ritual your own. Hang the one that feels lucky to you.',
      color:'#c9a24b', note:'Hung with intention.', isCustom:true, beads:['#eef3fa','#c9a24b','#eef3fa']}
  ];

  let currentIndex = 0;

  /* ---------- DOM refs ---------- */
  const charmEl = document.getElementById('charm');
  const glyphEl = document.getElementById('charmGlyph');
  const tailEl = charmEl.querySelector('.tail');
  const threadPath = document.getElementById('threadPath');
  const hookEl = document.getElementById('hook');
  const beamWrap = document.getElementById('beamWrap');
  const hideTab = document.getElementById('hideTab');
  const hintEl = document.getElementById('hint');
  const pickerEl = document.getElementById('picker');
  const nameEl = document.getElementById('charmName');
  const originEl = document.getElementById('charmOrigin');
  const descEl = document.getElementById('charmDesc');
  const ritualBtn = document.getElementById('ritualBtn');
  const ritualNote = document.getElementById('ritualNote');
  const eyesEl = document.getElementById('eyes');
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const customRow = document.getElementById('customRow');
  const customInput = document.getElementById('customInput');
  const customApply = document.getElementById('customApply');
  const beadEls = [document.getElementById('bead0'), document.getElementById('bead1'), document.getElementById('bead2')];

  /* =====================================================================
     ROPE SIMULATION
     Modelled on the Lucky Dangle reference: a Verlet chain of 12 points held
     together by distance constraints, stepped at a fixed 120 Hz.
     All values in the sim are "world units"; S converts world units to px.
     ===================================================================== */
  /*SIM-START*/
  const N = 12;                 // rope points
  const SEG = 15.5;             // rest length of one segment
  const REST = SEG * (N - 1);   // 170.5 -- rope length at rest
  const MAXLEN = REST * 1.4;    // the grab may stretch the rope up to 1.4x
  const STEP = 1 / 120;         // fixed physics step
  const HIDE_Y = -260.5;        // anchor height when the rope is retracted
  const BEAD_STATIONS = [34, 24, 15]; // distance of each bead from the rope's end
  const BEAD_SIZES = [7, 12, 7];      // small, BIG, small (world units)

  const pts = Array.from({length:N}, ()=>({x:0, y:0, px:0, py:0}));
  const tip = pts[N-1];
  const sim = {
    g: 0,                 // anchor x
    f: HIDE_Y,            // anchor y
    hangY: 22,            // anchor y while hanging
    B: 22,                // rope end -> charm centre
    vw: 1000,             // viewport width in world units
    calm: false,          // reduced motion: no wind / tremble
    dangling: false,
    dropT: 0, dropTarget: 0, retractT: -1, retractFrom: 0,
    grabbing: false, k: null,
    ptr: null, prevPtr: null, pvx: 0, pvy: 0,
    hover: false,
    wt: 0
  };

  const clamp = (v, a, b)=> Math.min(Math.max(v, a), b);

  function clampAnchor(x){
    const C = Math.min(90, sim.vw / 2);
    return clamp(x, C, sim.vw - C);
  }

  function resetRope(){
    for(let i=0;i<N;i++){
      const p = pts[i];
      p.x = p.px = sim.g;
      p.y = p.py = sim.f + i*SEG;
    }
  }

  // direction the charm hangs in (angle of the last two segments, 0 = straight down)
  function tipAngle(){
    const a = pts[N-3], b = pts[N-1];
    return Math.atan2(b.x - a.x, b.y - a.y);
  }

  // an impulse: shifting the previous position gives the tip a sideways velocity
  function kick(mag){
    const m = mag || (18 + Math.random()*8);
    tip.px += m * (Math.random() < 0.5 ? 1 : -1);
  }

  // where the rope's end should sit while the charm is being held at point p
  function setGrabTarget(p){
    const dx = p.x - sim.g, dy = p.y - sim.f;
    const d = Math.max(Math.hypot(dx, dy), 1);
    const len = clamp(d - sim.B, 1, MAXLEN);
    sim.k = { x: sim.g + dx/d*len, y: sim.f + dy/d*len };
  }

  function pointAt(t){
    const f = clamp(t, 0, 1) * (N - 1);
    const i = Math.min(Math.floor(f), N - 2);
    const r = f - i, a = pts[i], b = pts[i+1];
    return { x: a.x + (b.x - a.x)*r, y: a.y + (b.y - a.y)*r };
  }

  function step(){
    sim.wt += STEP;

    // --- anchor: hang / drop-then-retract / stay hidden
    if(sim.dangling){
      sim.retractT = -1;
      sim.f += (sim.hangY - sim.f) * 0.08;
      if(Math.abs(sim.f - sim.hangY) < 0.5) sim.f = sim.hangY;
    } else if(sim.dropT > 0){
      sim.dropT -= STEP;
      sim.f += (sim.dropTarget - sim.f) * 0.15;
      if(sim.dropT <= 0){ sim.retractT = 0; sim.retractFrom = sim.f; }
    } else if(sim.retractT >= 0){
      sim.retractT += STEP;
      const t = Math.min(sim.retractT / 0.3, 1), e = t*t*(3 - 2*t);
      sim.f = sim.retractFrom + (HIDE_Y - sim.retractFrom) * e;
      if(t >= 1) sim.retractT = -1;
    }

    // --- Verlet integration: damping, gravity, and a very slow breeze so it never freezes
    const wind = sim.calm ? 0 : 0.0035*Math.sin(sim.wt*0.55) + 0.002*Math.sin(sim.wt*1.3 + 0.8);
    for(let i=1;i<N;i++){
      const p = pts[i];
      const vx = (p.x - p.px) * 0.98, vy = (p.y - p.py) * 0.98;
      p.px = p.x; p.py = p.y;
      p.x += vx + wind * (i/(N-1));
      p.y += vy + 0.125;
    }

    // --- the pointer nudges the charm and the rope when it gets close
    if(sim.ptr && !sim.grabbing){
      if(sim.prevPtr){
        sim.pvx = sim.pvx*0.75 + (sim.ptr.x - sim.prevPtr.x)*0.25;
        sim.pvy = sim.pvy*0.75 + (sim.ptr.y - sim.prevPtr.y)*0.25;
      }
      sim.prevPtr = sim.ptr;
      const t = tipAngle();
      const cx = tip.x + sim.B*Math.sin(t), cy = tip.y + sim.B*Math.cos(t);
      const dx = cx - sim.ptr.x, dy = cy - sim.ptr.y;
      const s = Math.hypot(dx, dy), R = 40;
      if(s < R && s > 0.5){
        const l = (R - s)/R, d = l*l*0.4, q = l*0.1;
        tip.x += (dx/s)*d + clamp(sim.pvx, -14, 14)*q;
        tip.y += ((dy/s)*d + clamp(sim.pvy, -14, 14)*q) * 0.35;
      }
      for(let i=1;i<N-2;i++){
        const p = pts[i];
        const ex = p.x - sim.ptr.x, ey = p.y - sim.ptr.y;
        const e2 = ex*ex + ey*ey;
        if(e2 < R*R && e2 > 1){
          const dist = Math.sqrt(e2), push = ((R - dist)/R) * 0.8;
          p.x += (ex/dist)*push; p.y += (ey/dist)*push;
        }
      }
    } else {
      sim.prevPtr = null; sim.pvx = 0; sim.pvy = 0;
    }

    // --- hovering over the charm gives it a little jingle
    if(sim.hover && !sim.grabbing && !sim.calm){
      tip.x += Math.sin(sim.wt*38) * 0.9;
      tip.y += Math.cos(sim.wt*29) * 0.25;
    }

    // --- pulling the charm up near the beam slides the whole rope along it
    if(sim.grabbing && sim.k && sim.k.y < 60){
      sim.g += (sim.k.x - sim.g) * 0.12;
      sim.g = clampAnchor(sim.g);
    }

    // --- distance constraints (5 relaxation passes). Because they are only
    //     approximately satisfied, a hard pull makes the rope visibly stretch.
    for(let it=0; it<5; it++){
      pts[0].x = sim.g; pts[0].y = sim.f;
      if(sim.grabbing && sim.k){ tip.x = sim.k.x; tip.y = sim.k.y; }
      for(let a=0; a<N-1; a++){
        const n = pts[a], i = pts[a+1];
        const rx = i.x - n.x, ry = i.y - n.y;
        const h = Math.max(Math.hypot(rx, ry), 1e-4);
        const l = (h - SEG)/h/2;
        const dx = rx*l, dy = ry*l;
        if(a === 0){ i.x -= dx*2; i.y -= dy*2; }
        else if(sim.grabbing && a === N-2){ n.x += dx*2; n.y += dy*2; }
        else { n.x += dx; n.y += dy; i.x -= dx; i.y -= dy; }
      }
    }
  }
  /*SIM-END*/

  /* ---------- world <-> screen ---------- */
  const ANCHOR_Y_PX = 32;      // centre of the brass hook
  let S = 1.45;                // px per world unit

  function computeScale(){
    return clamp((window.innerHeight - 330) / REST, 0.9, 1.45);
  }
  function measureCharm(){
    const h = charmEl.offsetHeight || 64;
    sim.B = h / 2 / S;
  }
  function sizeBeads(){
    beadEls.forEach((el,i)=>{
      const px = (BEAD_SIZES[i] * S).toFixed(1) + 'px';
      el.style.width = px; el.style.height = px;
    });
  }
  function toWorld(e){ return { x: e.clientX / S, y: e.clientY / S }; }

  S = computeScale();
  sim.vw = window.innerWidth / S;
  sim.hangY = ANCHOR_Y_PX / S;
  sim.g = clampAnchor(sim.vw / 2);
  resetRope();
  sizeBeads();

  /* ---------- visual rendering (emoji or image) ---------- */
  function renderCharmVisual(el, c){
    if(c.img){
      el.innerHTML = `<img src="${c.img}" alt="${c.name}" draggable="false" style="height:1em;width:auto;display:block;pointer-events:none;">`;
    } else {
      el.textContent = c.emoji;
    }
  }

  /* ---------- picker buttons ---------- */
  CHARMS.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'charm-btn';
    b.style.setProperty('--btn-color', c.color);
    renderCharmVisual(b, c);
    b.title = c.name;
    b.addEventListener('click', ()=> selectCharm(i));
    pickerEl.appendChild(b);
  });

  function refreshPickerActive(){
    [...pickerEl.children].forEach((b,i)=>{
      b.classList.toggle('active', i===currentIndex);
      renderCharmVisual(b, CHARMS[i]);
    });
  }

  function selectCharm(i, withKick = true){
    currentIndex = i;
    const c = CHARMS[i];
    renderCharmVisual(glyphEl, c);
    tailEl.style.height = ((c.tail || 0.4) * 100) + '%';
    charmEl.style.setProperty('--glow', c.color);
    nameEl.textContent = c.name;
    originEl.textContent = c.origin;
    descEl.textContent = c.desc;
    ritualNote.classList.remove('show');
    customRow.classList.toggle('show', !!c.isCustom);
    eyesEl.style.display = c.isDaruma ? 'flex' : 'none';
    if(c.isDaruma) updateEyes();
    beadEls.forEach((el,bi)=> el.style.setProperty('--b', c.beads[bi]));
    refreshPickerActive();
    measureCharm();
    if(withKick && sim.dangling) kick();
  }

  customApply.addEventListener('click', ()=>{
    const val = customInput.value.trim();
    if(!val) return;
    CHARMS[5].emoji = val;
    delete CHARMS[5].img;
    renderCharmVisual(glyphEl, CHARMS[5]);
    refreshPickerActive();
    performRitual();
  });
  customInput.addEventListener('keydown', e=>{ if(e.key==='Enter') customApply.click(); });

  function updateEyes(){
    const c = CHARMS[currentIndex];
    eyeL.classList.toggle('painted', c.stage>=1);
    eyeR.classList.toggle('painted', c.stage>=2);
  }

  /* ---------- hang / retract (hide & show) ---------- */
  function setHang(on){
    if(on === sim.dangling) return;
    sim.dangling = on;
    if(on){
      sim.dropT = 0; sim.retractT = -1;
      kick();
    } else {
      // reference behaviour: sag a little first, then whip up and out of sight
      sim.dropT = 0.18; sim.dropTarget = sim.f + 16; sim.retractT = -1;
    }
    beamWrap.classList.toggle('hidden', !on);
    hideTab.textContent = on ? 'Hide ⌃H' : 'Show ⌃H';
  }
  function toggleHide(){ setHang(!sim.dangling); }
  hideTab.addEventListener('click', toggleHide);

  /* ---------- ritual / blessing ---------- */
  let pulse = 0;   // extra velocity fed to the scale spring for a "pop"
  function performRitual(){
    if(!sim.dangling){
      setHang(true);
      setTimeout(doRitual, 700);
      return;
    }
    doRitual();
  }
  function doRitual(){
    const c = CHARMS[currentIndex];
    kick(30 + Math.random()*10);
    pulse += 3.4;
    burstSparkles(c.color);
    if(c.isDaruma){
      c.stage = (c.stage+1)%3;
      updateEyes();
      ritualNote.textContent = c.stage===0 ? 'A fresh doll. Make a wish.' :
                                c.stage===1 ? 'Left eye painted. Wish made.' :
                                'Right eye painted. Wish come true.';
    } else {
      ritualNote.textContent = c.note;
    }
    ritualNote.classList.add('show');
    hintGone();
  }
  ritualBtn.addEventListener('click', performRitual);

  function burstSparkles(color){
    const rect = charmEl.getBoundingClientRect();
    const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
    const n = reduceMotion ? 0 : 10;
    for(let i=0;i<n;i++){
      const s = document.createElement('div');
      s.className='sparkle';
      s.textContent = Math.random()>0.5?'✦':'·';
      s.style.left = cx+'px';
      s.style.top = cy+'px';
      s.style.color = color;
      const ang = Math.random()*Math.PI*2;
      const dist = 40+Math.random()*50;
      s.style.setProperty('--end', `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist - 20}px)`);
      document.body.appendChild(s);
      s.addEventListener('animationend', ()=> s.remove());
    }
  }

  function hintGone(){ hintEl.classList.add('gone'); }

  /* ---------- keyboard shortcuts ---------- */
  window.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    if(e.key.toLowerCase()==='r') performRitual();
    if(e.key.toLowerCase()==='h') toggleHide();
  });

  /* ---------- grabbing the charm ---------- */
  let downPos = null, moved = 0;
  charmEl.addEventListener('pointerdown', e=>{
    e.preventDefault();
    sim.grabbing = true;
    charmEl.classList.add('dragging');
    moved = 0;
    downPos = toWorld(e);
    sim.ptr = downPos;
    setGrabTarget(downPos);
    try{ charmEl.setPointerCapture(e.pointerId); }catch(_){}
    hintGone();
  });
  window.addEventListener('pointermove', e=>{
    const p = toWorld(e);
    sim.ptr = p;
    if(sim.grabbing){
      moved = Math.max(moved, Math.hypot(p.x - downPos.x, p.y - downPos.y));
      setGrabTarget(p);
    }
    if(hookDragging){
      sim.g = clamp(p.x, 30/S, sim.vw - 30/S);
    }
  });
  window.addEventListener('pointerout', e=>{ if(!e.relatedTarget) sim.ptr = null; });
  function endGrab(){
    if(!sim.grabbing) return;
    sim.grabbing = false;
    sim.k = null;
    charmEl.classList.remove('dragging');
    if(moved < 6) kick();          // a tap is just a flick
  }
  charmEl.addEventListener('pointerup', endGrab);
  charmEl.addEventListener('pointercancel', endGrab);
  window.addEventListener('pointerup', ()=>{ endGrab(); hookDragging = false; });

  /* ---------- hover: glow + twinkles (the jingle itself lives in the sim) ---------- */
  let twinkleTimer = null;
  function spawnTwinkle(){
    const rect = charmEl.getBoundingClientRect();
    const s = document.createElement('div');
    s.className = 'twinkle-spark';
    s.textContent = Math.random()>0.5 ? '✦' : '✧';
    s.style.color = CHARMS[currentIndex].color;
    s.style.left = (rect.left + Math.random()*rect.width) + 'px';
    s.style.top = (rect.top + Math.random()*rect.height*0.8) + 'px';
    document.body.appendChild(s);
    s.addEventListener('animationend', ()=> s.remove());
  }
  charmEl.addEventListener('pointerenter', ()=>{
    sim.hover = true;
    if(!reduceMotion && !twinkleTimer){
      spawnTwinkle();
      twinkleTimer = setInterval(spawnTwinkle, 220);
    }
  });
  charmEl.addEventListener('pointerleave', ()=>{
    sim.hover = false;
    if(twinkleTimer){ clearInterval(twinkleTimer); twinkleTimer = null; }
  });

  /* ---------- dragging the brass hook along the beam ---------- */
  let hookDragging = false;
  hookEl.addEventListener('pointerdown', e=>{
    hookDragging = true;
    try{ hookEl.setPointerCapture(e.pointerId); }catch(_){}
  });

  /* ---------- resize ---------- */
  window.addEventListener('resize', ()=>{
    const old = S, oldG = sim.g;
    S = computeScale();
    sim.vw = window.innerWidth / S;
    sim.hangY = ANCHOR_Y_PX / S;
    sim.g = clampAnchor(oldG * old / S);
    const dx = sim.g - oldG;
    for(const p of pts){ p.x += dx; p.px += dx; }
    measureCharm();
    sizeBeads();
  });

  /* ---------- rendering + springs ---------- */
  let gs = 1, gsV = 0;       // scale spring ("a little bigger" while held, pops on ritual)
  let st = 0, stV = 0;       // stretch spring (elongation along the cord)
  const px = v => (v*S).toFixed(2);

  function render(dt){
    // springs: slightly underdamped so releasing the charm snaps back with a bounce
    const gsTarget = sim.grabbing ? 1.14 : 1;
    gsV += pulse; pulse = 0;
    gsV += (170*(gsTarget - gs) - 11*gsV) * dt;
    gs += gsV * dt;

    let len = 0;
    for(let i=0;i<N-1;i++) len += Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
    const over = len / REST;
    const stTarget = sim.grabbing ? Math.min(0.28, 0.05 + Math.max(0, over - 1)*0.9) : 0;
    stV += (190*(stTarget - st) - 10*stV) * dt;
    st += stV * dt;

    // rope: smooth quadratic chain through the points
    let d = `M ${px(pts[0].x)} ${px(pts[0].y)}`;
    for(let r=1;r<N-1;r++){
      const mx = (pts[r].x + pts[r+1].x)/2, my = (pts[r].y + pts[r+1].y)/2;
      d += ` Q ${px(pts[r].x)} ${px(pts[r].y)} ${px(mx)} ${px(my)}`;
    }
    d += ` L ${px(tip.x)} ${px(tip.y)}`;
    threadPath.setAttribute('d', d);

    // three beads ride the rope at fixed distances from its end
    for(let i=0;i<3;i++){
      const p = pointAt(1 - BEAD_STATIONS[i]/REST);
      const half = (BEAD_SIZES[i]*S)/2;
      beadEls[i].style.transform = `translate(${(p.x*S - half).toFixed(1)}px, ${(p.y*S - half).toFixed(1)}px)`;
    }

    // charm: hangs from the rope's end, follows its direction, stretches when pulled
    const ang = tipAngle();
    const sx = gs * (1 - st*0.45), sy = gs * (1 + st);
    charmEl.style.transform =
      `translate(${px(tip.x)}px, ${px(tip.y)}px) rotate(${(-ang*180/Math.PI).toFixed(2)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)}) translate(-50%, 0)`;

    hookEl.style.left = (sim.g*S).toFixed(1) + 'px';
  }

  let acc = 0, last = 0;
  function frame(ts){
    requestAnimationFrame(frame);
    const dt = last ? Math.min((ts - last)/1000, 0.1) : STEP;
    last = ts;
    acc += dt;
    let n = 0;
    while(acc >= STEP && n < 24){ step(); acc -= STEP; n++; }
    if(n === 24) acc = 0;
    render(Math.min(dt, 0.033));
  }

  /* ---------- init ---------- */
  sim.calm = reduceMotion;
  selectCharm(0, false);
  window.addEventListener('pointerdown', hintGone, {once:true});
  if(reduceMotion){
    sim.dangling = true; sim.f = sim.hangY; resetRope();
  } else {
    // like the reference: the charm drops in half a second after load
    setTimeout(()=> setHang(true), 500);
  }
  requestAnimationFrame(frame);

  // debug handle for the console / tests
  window.__luckyDangle = { sim, pts, step, render, setHang, selectCharm, performRitual };
})();
</script>
</body>
</html>
